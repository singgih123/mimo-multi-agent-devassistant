[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimo-multi-agent-devassistant"
version = "0.1.0"
description = "Multi-agent AI development assistant powered by Xiaomi MiMo V2.5 models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "singgih123" },
]
keywords = ["ai", "agents", "mimo", "xiaomi", "multi-agent", "code-review", "development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.30.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.35.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
mimo-agent = "mimo_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mimo_agents"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
